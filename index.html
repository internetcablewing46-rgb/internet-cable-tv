<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>แจ้งเสีย Internet - Cable TV</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📡 แจ้งเสีย Internet - Cable TV</h2>

  <form id="reportForm">

    <label>ประเภท</label>
    <select id="type" required>
      <option value="">-- เลือกประเภท --</option>
      <option value="Internet">Internet</option>
      <option value="Cable TV">Cable TV</option>
    </select>

    <label>เบอร์โทร</label>
    <input
      type="text"
      id="phone"
      placeholder="กรอกเบอร์โทร"
      required
    >

    <label>ผู้แจ้ง</label>
    <input
      type="text"
      id="reporter"
      placeholder="ชื่อผู้แจ้ง"
      required
    >

    <label>ซอย/บ้านเลขที่</label>
    <input
      type="text"
      id="address"
      placeholder="เช่น ซอย 2 บ้านเลขที่ 45"
    >

    <label>ปัญหา</label>
    <input
      type="text"
      id="problem"
      placeholder="ระบุอาการเสีย"
      required
    >

    <label>รายละเอียด</label>
    <textarea
      id="detail"
      placeholder="รายละเอียดเพิ่มเติม"
    ></textarea>

    <button type="submit" id="submitButton">
      แจ้งเสีย
    </button>

  </form>

  <div id="message"></div>

</div>


<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyMpxvS7QIFOfTOe8x6Rea9GA79HbIE2UIolDKBTixXxuvTrGoMoC5cDK6YvEnFgUc7/exec";

const LIFF_ID =
  "2011831663-lTzHshSv";

let lineUserId = "";


async function initLIFF() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {

      liff.login();

      return;
    }

    const profile =
      await liff.getProfile();

    lineUserId =
      profile.userId;

    console.log(
      "LINE User ID:",
      lineUserId
    );

  } catch (error) {

    console.error(
      "LIFF Error:",
      error
    );

  }

}


initLIFF();


document
  .getElementById("reportForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const button =
        document.getElementById(
          "submitButton"
        );

      const message =
        document.getElementById(
          "message"
        );

      button.disabled = true;

      button.textContent =
        "กำลังส่งข้อมูล...";


      const data = {

        action: "save_report",

        type:
          document.getElementById(
            "type"
          ).value,

        phone:
          document.getElementById(
            "phone"
          ).value,

        reporter:
          document.getElementById(
            "reporter"
          ).value,

        address:
          document.getElementById(
            "address"
          ).value,

        problem:
          document.getElementById(
            "problem"
          ).value,

        detail:
          document.getElementById(
            "detail"
          ).value,

        line_user_id:
          lineUserId

      };


      try {

        await fetch(
          GAS_URL,
          {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(data)
          }
        );


        message.textContent =
          "✅ แจ้งเสียเรียบร้อยแล้ว";

        message.style.color =
          "green";


        document
          .getElementById(
            "reportForm"
          )
          .reset();


      } catch (error) {

        message.textContent =
          "❌ ไม่สามารถส่งข้อมูลได้";

        message.style.color =
          "red";

      }


      button.disabled = false;

      button.textContent =
        "แจ้งเสีย";

    }
  );

</script>

</body>
</html>
